<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バス時刻表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f0f2f5; color: #1a1a1a; }
  header { background: #1a73e8; color: white; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
  #clock { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  #date-info { font-size: 13px; opacity: 0.85; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .day-type-btn { font-size: 12px; background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: white; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .tab-bar { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 15px; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .content { padding: 12px; display: none; }
  .content.active { display: block; }
  .route-card { background: white; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .route-header { padding: 12px 16px; background: #e8f0fe; border-bottom: 1px solid #d0ddf8; }
  .route-title { font-size: 15px; font-weight: 700; color: #1a73e8; }
  .route-sub { font-size: 12px; color: #555; margin-top: 2px; }
  .next-buses { padding: 12px 16px; }
  .next-label { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-bottom: 8px; }
  .bus-row { display: flex; align-items: center; margin-bottom: 8px; }
  .bus-time { font-size: 24px; font-weight: 700; min-width: 70px; }
  .bus-time.soon { color: #d93025; }
  .bus-time.coming { color: #e37400; }
  .bus-wait { font-size: 13px; color: #888; margin-left: 8px; }
  .bus-wait span { color: #1a73e8; font-weight: 600; }
  .no-bus { color: #888; font-size: 14px; padding: 4px 0; }
  .timetable-toggle { padding: 8px 16px 12px; }
  .toggle-btn { font-size: 13px; color: #1a73e8; background: none; border: none; cursor: pointer; padding: 0; }
  .full-timetable { padding: 0 16px 12px; display: none; }
  .full-timetable.open { display: block; }
  .hour-row { display: flex; margin-bottom: 4px; font-size: 14px; }
  .hour-label { min-width: 40px; font-weight: 600; color: #555; }
  #refresh-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: #1a73e8; color: white; border: none; font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
</style>
</head>

5, 43, 52], "20": [7, 42], "21": [10, 26], "22": [50]}}, "jr_iki_minami6": {"weekday": {"5": [], "6": [40], "7": [6, 28, 50], "8": [0, 30, 40, 50], "9": [0, 12, 47], "10": [12, 52], "11": [12, 52], "12": [12, 52], "13": [12, 52], "14": [12, 52], "15": [12, 47], "16": [21, 45], "17": [17, 46], "18": [22], "19": [43], "20": [], "21": [], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [22], "10": [22], "11": [12], "12": [12], "13": [22], "14": [22], "15": [12], "16": [12], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_iki_minami8": {"weekday": {"5": [], "6": [], "7": [6, 28, 50], "8": [0, 30, 40], "9": [12], "10": [12], "11": [12], "12": [12], "13": [12], "14": [12], "15": [12], "16": [21], "17": [17], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [3], "10": [3], "11": [35], "12": [35], "13": [3], "14": [3], "15": [35], "16": [35], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_kaeri_minami6": {"weekday": {"5": [], "6": [], "7": [28], "8": [8, 33], "9": [44], "10": [19, 40], "11": [19, 46], "12": [19, 46], "13": [19, 46], "14": [19, 46], "15": [19, 46], "16": [19, 39], "17": [39, 54], "18": [39], "19": [6], "20": [6, 31], "21": [4], "22": [9], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [18], "10": [28], "11": [28], "12": [18], "13": [18], "14": [28], "15": [28], "16": [18], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_kaeri_minami8": {"weekday": {"5": [], "6": [], "7": [57], "8": [52], "9": [48], "10": [47], "11": [], "12": [16], "13": [16, 47], "14": [16], "15": [16, 47], "16": [53], "17": [29, 50], "18": [16, 36, 59], "19": [59], "20": [25], "21": [30], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [17, 50], "10": [50], "11": [], "12": [17], "13": [17, 50], "14": [50], "15": [], "16": [17, 50], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jotetsu_iki_minami34": {"weekday": {"6": [47], "7": [10, 22, 31, 38, 57], "8": [1, 13, 23, 28, 38, 48, 53], "9": [8, 19, 33, 44, 54], "10": [8, 33, 58], "11": [8, 33, 57], "12": [38, 57], "13": [38, 57], "14": [28, 57], "15": [38, 50], "16": [2, 23, 38, 55], "17": [9, 19, 34, 45, 59], "18": [4, 14, 18, 30, 38, 46, 59], "19": [8, 19, 28, 39, 58], "20": [13, 28], "21": [3, 23, 33, 52], "22": [11]}, "saturday": {"6": [44], "7": [5, 19, 32], "8": [0, 4, 20, 37, 50], "9": [2, 20, 27, 35, 47], "10": [5, 30, 47], "11": [1, 17, 31, 52], "12": [27, 48], "13": [0, 33, 58], "14": [38], "15": [5, 38, 48]}, "holiday": {"16": [8, 38, 48], "17": [8, 38, 53], "18": [8, 28, 43, 54], "19": [7, 37, 51], "20": [6, 31, 51], "21": [10, 51]}}, "jotetsu_kaeri_kawazoe": {"weekday": {"6": [19, 31, 39, 45, 51, 55], "7": [1, 5, 8, 10, 21, 22, 26, 31, 36, 37, 40, 45, 46, 50, 57, 59], "8": [1, 6, 12, 18, 23, 24, 26, 31, 37, 38, 44, 45, 50, 57], "9": [2, 5, 11, 22, 26, 33, 39, 46, 50], "10": [13, 15, 26, 29, 36, 40], "11": [11, 23, 31, 34, 40, 56], "12": [14, 16, 31, 34, 40], "13": [10, 15, 27, 29, 37, 40, 45], "14": [14, 20, 29, 32, 40, 45], "15": [9, 15, 24, 28, 37, 41, 59], "16": [0, 8, 11, 14, 22, 30, 37, 38, 44, 53], "17": [5, 13, 28, 35, 40, 45, 51, 56], "18": [8, 11, 15, 16, 18, 25, 33, 37, 42, 50, 55], "19": [6, 10, 11, 13, 18, 20, 39, 43, 44, 54, 55], "20": [28, 29, 32, 43, 53], "21": [8, 18, 21, 32, 50], "22": [54]}, "saturday": {"6": [28, 34, 48, 49, 54], "7": [8, 20, 24, 35, 43, 54], "8": [9, 12, 16, 34, 40, 54], "9": [9, 21, 23, 28, 40, 56], "10": [9, 11, 20, 30, 40, 51], "11": [9, 22, 30, 40, 51], "12": [9, 26, 30, 40], "13": [4, 9, 26, 28, 35, 45, 56], "14": [9, 23, 30, 36, 40], "15": [14, 26, 35, 45, 46]}, "holiday": {"16": [16, 17, 29, 35, 45, 46], "17": [15, 25, 35, 40, 56], "18": [15, 28, 31, 35, 55], "19": [15, 20, 26, 35], "20": [0, 18, 24, 28, 45, 55, 58], "21": [1, // 自動判定した初期値
const _day = new Date().getDay();
let currentDayType = _day === 0 ? 'holiday' : _day === 6 ? 'saturday' : 'weekday';
const dayTypes = ['weekday', 'saturday', 'holiday'];
const dayLabels = {weekday:'平日', saturday:'土曜', holiday:'日祝'};

function cycleDayType() {
  const idx = dayTypes.indexOf(currentDayType);
  currentDayType = dayTypes[(idx + 1) % dayTypes.length];
  update();
}

function getTimetable(key) {
  const d = BUS_DATA[key];
  if (!d) return {};
  return d[currentDayType] || d['weekday'] || {};
}

function getNextBuses(timetable, n=3) {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const all = [];
  for (const [h, mins] of Object.entries(timetable))
    for (const m of mins) all.push(parseInt(h) * 60 + m);
  all.sort((a,b) => a-b);
  return all.filter(t => t > nowMins).slice(0, n);
}

function renderNextBuses(elId, key) {
  const timetable = getTimetable(key);
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const buses = getNextBuses(timetable);
  const el = document.getElementById(elId);
  if (!el) return;
  if (buses.length === 0) {
    el.innerHTML = '<div class="next-label">次のバス</div><div class="no-bus">本日の運行は終了しました</div>';
    return;
  }
  let html = '<div class="next-label">次のバス</div>';
  buses.forEach(t => {
    const h = Math.floor(t / 60), m = t % 60;
    const diff = t - nowMins;
    const cls = diff <= 5 ? 'soon' : diff <= 15 ? 'coming' : '';
    const wait = diff < 1 ? 'まもなく' : `あと<span>${diff}分</span>`;
    html += `<div class="bus-row"><div class="bus-time ${cls}">${h}:${String(m).padStart(2,'0')}</div><div class="bus-wait">${wait}</div></div>`;
  });
  el.innerHTML = html;
}

function renderFullTable(elId, key) {
  const timetable = getTimetable(key);
  const el = document.getElementById(elId);
  if (!el) return;
  const hours = Object.keys(timetable).map(Number).sort((a,b)=>a-b);
  let html = '';
  for (const h of hours) {
    const mins = timetable[h];
    if (!mins || mins.length === 0) continue;
    html += `<div class="hour-row"><div class="hour-label">${h}時</div><div class="hour-mins">${mins.map(m=>String(m).padStart(2,'0')).join(' ')}</div></div>`;
  }
  el.innerHTML = html || '<div class="no-bus">データなし</div>';
}

const keyMap = {
  'jotetsu-iki':'jotetsu_iki','jotetsu-kaeri':'jotetsu_kaeri',
  'jr-iki-minami6':'jr_iki_minami6','jr-iki-minami8':'jr_iki_minami8',
  'jr-kaeri-minami6':'jr_kaeri_minami6','jr-kaeri-minami8':'jr_kaeri_minami8',
  'jotetsu-iki-minami34':'jotetsu_iki_minami34',
  'jotetsu-kaeri-kawazoe':'jotetsu_kaeri_kawazoe',
};

function toggleTable(key) {
  const el = document.getElementById('table-' + key);
  const btn = el.previousElementSibling.querySelector('button');
  if (el.classList.contains('open')) {
    el.classList.remove('open'); btn.textContent = '時刻表全表示 ▼';
  } else {
    renderFullTable('table-' + key, keyMap[key]);
    el.classList.add('open'); btn.textContent = '時刻表を閉じる ▲';
  }
}

function updateClock() {
  const now = new Date();
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('date-str').textContent = `${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;
  document.getElementById('day-type-label').textContent = dayLabels[currentDayType] + ' ▶';
}

function update() {
  updateClock();
  // 開いているテーブルを再描画
  document.querySelectorAll('.full-timetable.open').forEach(el => {
    const key = el.id.replace('table-', '');
    renderFullTable(el.id, keyMap[key]);
  });
  Object.keys(keyMap).forEach(k => renderNextBuses('next-' + k, keyMap[k]));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

update();
setInterval(update, 60000);
</script>

</html>
