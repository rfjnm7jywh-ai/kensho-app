<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バス時刻表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f0f2f5; color: #1a1a1a; }
  header { background: #1a73e8; color: white; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
  #clock { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  #date-info { font-size: 13px; opacity: 0.85; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .day-type-btn { font-size: 12px; background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: white; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .tab-bar { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 15px; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .content { padding: 12px; display: none; }
  .content.active { display: block; }
  .route-card { background: white; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .route-header { padding: 12px 16px; background: #e8f0fe; border-bottom: 1px solid #d0ddf8; }
  .route-title { font-size: 15px; font-weight: 700; color: #1a73e8; }
  .route-sub { font-size: 12px; color: #555; margin-top: 2px; }
  .next-buses { padding: 12px 16px; }
  .next-label { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-bottom: 8px; }
  .bus-row { display: flex; align-items: center; margin-bottom: 8px; }
  .bus-time { font-size: 24px; font-weight: 700; min-width: 70px; }
  .bus-time.soon { color: #d93025; }
  .bus-time.coming { color: #e37400; }
  .bus-wait { font-size: 13px; color: #888; margin-left: 8px; }
  .bus-wait span { color: #1a73e8; font-weight: 600; }
  .no-bus { color: #888; font-size: 14px; padding: 4px 0; }
  .timetable-toggle { padding: 8px 16px 12px; }
  .toggle-btn { font-size: 13px; color: #1a73e8; background: none; border: none; cursor: pointer; padding: 0; }
  .full-timetable { padding: 0 16px 12px; display: none; }
  .full-timetable.open { display: block; }
  .hour-row { display: flex; margin-bottom: 4px; font-size: 14px; }
  .hour-label { min-width: 40px; font-weight: 600; color: #555; }
  #refresh-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: #1a73e8; color: white; border: none; font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<header>
  <div id="clock">--:--</div>
  <div id="date-info">
    <span id="date-str"></span>
    <button class="day-type-btn" onclick="cycleDayType()" id="day-type-label">平日</button>
  </div>
</header>
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('iki')">行き</div>
  <div class="tab" onclick="switchTab('kaeri')">帰り</div>
</div>
<div id="tab-iki" class="content active">
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">じょうてつバス</div>
      <div class="route-sub">南6西11 → 定山渓方面 （快速7・8・南96ほか）</div>
    </div>
    <div class="next-buses" id="next-jotetsu-iki"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jotetsu-iki')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jotetsu-iki"></div>
  </div>
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">JR北海道バス [51] 啓明線</div>
      <div class="route-sub">南8西16 → 札幌駅前</div>
    </div>
    <div class="next-buses" id="next-jr-iki-minami8"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jr-iki-minami8')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jr-iki-minami8"></div>
  </div>
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">JR北海道バス [53] 啓明線</div>
      <div class="route-sub">南6西20 → 札幌駅前</div>
    </div>
    <div class="next-buses" id="next-jr-iki-minami6"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jr-iki-minami6')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jr-iki-minami6"></div>
  </div>
</div>
<div id="tab-kaeri" class="content">
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">じょうてつバス</div>
      <div class="route-sub">藻岩高校前 → 札幌駅方面 （快速7・8・南55ほか）</div>
    </div>
    <div class="next-buses" id="next-jotetsu-kaeri"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jotetsu-kaeri')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jotetsu-kaeri"></div>
  </div>
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">JR北海道バス [51] 啓明線</div>
      <div class="route-sub">札幌駅前 → 南8西16方面</div>
    </div>
    <div class="next-buses" id="next-jr-kaeri-minami8"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jr-kaeri-minami8')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jr-kaeri-minami8"></div>
  </div>
  <div class="route-card">
    <div class="route-header">
      <div class="route-title">JR北海道バス [53] 啓明線</div>
      <div class="route-sub">札幌駅前 → 南6西20方面</div>
    </div>
    <div class="next-buses" id="next-jr-kaeri-minami6"></div>
    <div class="timetable-toggle"><button class="toggle-btn" onclick="toggleTable('jr-kaeri-minami6')">時刻表全表示 ▼</button></div>
    <div class="full-timetable" id="table-jr-kaeri-minami6"></div>
  </div>
</div>
<button id="refresh-btn" onclick="update()">↺</button>
<script>
const BUS_DATA = {"jotetsu_iki": {"weekday": {"6": [57], "7": [12, 32, 41, 51], "8": [2, 17, 47], "9": [13, 48], "10": [12, 48], "11": [13, 23, 48], "12": [13, 33, 58], "13": [14, 34, 49], "14": [19, 34, 54], "15": [19, 34, 54], "16": [19, 34, 49, 59], "17": [4, 20, 30, 45, 55], "18": [0, 15, 29, 43, 55], "19": [10, 13, 28, 43], "20": [12, 38], "21": [27, 48], "22": [2, 37]}, "saturday": {"6": [55], "7": [11, 31, 41], "8": [11, 31, 40], "9": [1, 11, 46], "10": [12, 47], "11": [11, 37], "12": [12, 32, 52], "13": [11, 44], "14": [19, 44, 53], "15": [19, 34, 54]}, "holiday": {"16": [19, 34, 44, 49, 54], "17": [19, 34, 49, 59], "18": [14, 34, 54], "19": [14, 33, 53], "20": [13, 43], "21": [13, 43], "22": [1, 27]}}, "jotetsu_kaeri": {"weekday": {"6": [4, 14, 28, 32, 45, 52, 54, 57], "7": [6, 13, 16, 22, 24, 25, 36, 40, 42, 43, 53, 58], "8": [1, 7, 18, 23, 24, 35, 43, 51, 57], "9": [7, 15, 16, 34, 47, 58], "10": [2, 9, 27, 30, 33, 50, 52], "11": [5, 21, 22, 30, 47, 51], "12": [19, 22, 30, 47, 51], "13": [5, 18, 22, 30, 44, 47, 56], "14": [0, 2, 11, 22, 30, 44, 55, 59], "15": [2, 22, 30, 34, 39, 45, 49, 51], "16": [0, 13, 19, 27, 30, 32, 33, 49, 55], "17": [1, 11, 27, 28, 30, 32, 44, 52, 59], "18": [19, 26, 30, 51, 55], "19": [5, 10, 17, 38, 46, 55], "20": [12, 17, 36, 43], "21": [5, 35, 39], "22": [28], "23": [15]}, "saturday": {"6": [18, 26, 39, 42, 53], "7": [14, 30, 38, 44], "8": [2, 9, 19, 31, 49], "9": [9, 19, 38, 52], "10": [21, 23, 30, 34, 52], "11": [0, 8, 17, 21, 30, 34, 52], "12": [10, 21, 29, 30, 49], "13": [16, 21, 30, 46, 52], "14": [6, 16, 21, 30, 50, 52], "15": [5, 21, 25, 30, 37, 48, 55]}, "holiday": {"16": [5, 21, 26, 30, 37, 56, 57], "17": [9, 20, 22, 30, 37, 51, 53], "18": [10, 18, 20, 30, 40, 51], "19": [3, 8, 12, 35, 43, 52], "20": [7, 42], "21": [10, 26], "22": [50]}}, "jr_iki_minami6": {"weekday": {"5": [], "6": [40], "7": [6, 28, 50], "8": [0, 30, 40, 50], "9": [0, 12, 47], "10": [12, 52], "11": [12, 52], "12": [12, 52], "13": [12, 52], "14": [12, 52], "15": [12, 47], "16": [21, 45], "17": [17, 46], "18": [22], "19": [43], "20": [], "21": [], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [22], "10": [22], "11": [12], "12": [12], "13": [22], "14": [22], "15": [12], "16": [12], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_iki_minami8": {"weekday": {"5": [], "6": [], "7": [6, 28, 50], "8": [0, 30, 40], "9": [12], "10": [12], "11": [12], "12": [12], "13": [12], "14": [12], "15": [12], "16": [21], "17": [17], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [3], "10": [3], "11": [35], "12": [35], "13": [3], "14": [3], "15": [35], "16": [35], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_kaeri_minami6": {"weekday": {"5": [], "6": [], "7": [28], "8": [8, 33], "9": [44], "10": [19, 40], "11": [19, 46], "12": [19, 46], "13": [19, 46], "14": [19, 46], "15": [19, 46], "16": [19, 39], "17": [39, 54], "18": [39], "19": [6], "20": [6, 31], "21": [4], "22": [9], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [18], "10": [28], "11": [28], "12": [18], "13": [18], "14": [28], "15": [28], "16": [18], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}, "jr_kaeri_minami8": {"weekday": {"5": [], "6": [], "7": [57], "8": [52], "9": [48], "10": [47], "11": [], "12": [16], "13": [16, 47], "14": [16], "15": [16, 47], "16": [53], "17": [29, 50], "18": [16, 36, 59], "19": [59], "20": [25], "21": [30], "22": [], "23": [], "24": []}, "holiday": {"5": [], "6": [], "7": [], "8": [], "9": [17, 50], "10": [50], "11": [], "12": [17], "13": [17, 50], "14": [50], "15": [], "16": [17, 50], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": []}}};

// 自動判定した初期値
const _day = new Date().getDay();
let currentDayType = _day === 0 ? 'holiday' : _day === 6 ? 'saturday' : 'weekday';
const dayTypes = ['weekday', 'saturday', 'holiday'];
const dayLabels = {weekday:'平日', saturday:'土曜', holiday:'日祝'};

function cycleDayType() {
  const idx = dayTypes.indexOf(currentDayType);
  currentDayType = dayTypes[(idx + 1) % dayTypes.length];
  update();
}

function getTimetable(key) {
  const d = BUS_DATA[key];
  if (!d) return {};
  return d[currentDayType] || d['weekday'] || {};
}

function getNextBuses(timetable, n=3) {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const all = [];
  for (const [h, mins] of Object.entries(timetable))
    for (const m of mins) all.push(parseInt(h) * 60 + m);
  all.sort((a,b) => a-b);
  return all.filter(t => t > nowMins).slice(0, n);
}

function renderNextBuses(elId, key) {
  const timetable = getTimetable(key);
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const buses = getNextBuses(timetable);
  const el = document.getElementById(elId);
  if (!el) return;
  if (buses.length === 0) {
    el.innerHTML = '<div class="next-label">次のバス</div><div class="no-bus">本日の運行は終了しました</div>';
    return;
  }
  let html = '<div class="next-label">次のバス</div>';
  buses.forEach(t => {
    const h = Math.floor(t / 60), m = t % 60;
    const diff = t - nowMins;
    const cls = diff <= 5 ? 'soon' : diff <= 15 ? 'coming' : '';
    const wait = diff < 1 ? 'まもなく' : `あと<span>${diff}分</span>`;
    html += `<div class="bus-row"><div class="bus-time ${cls}">${h}:${String(m).padStart(2,'0')}</div><div class="bus-wait">${wait}</div></div>`;
  });
  el.innerHTML = html;
}

function renderFullTable(elId, key) {
  const timetable = getTimetable(key);
  const el = document.getElementById(elId);
  if (!el) return;
  const hours = Object.keys(timetable).map(Number).sort((a,b)=>a-b);
  let html = '';
  for (const h of hours) {
    const mins = timetable[h];
    if (!mins || mins.length === 0) continue;
    html += `<div class="hour-row"><div class="hour-label">${h}時</div><div class="hour-mins">${mins.map(m=>String(m).padStart(2,'0')).join(' ')}</div></div>`;
  }
  el.innerHTML = html || '<div class="no-bus">データなし</div>';
}

const keyMap = {
  'jotetsu-iki':'jotetsu_iki','jotetsu-kaeri':'jotetsu_kaeri',
  'jr-iki-minami6':'jr_iki_minami6','jr-iki-minami8':'jr_iki_minami8',
  'jr-kaeri-minami6':'jr_kaeri_minami6','jr-kaeri-minami8':'jr_kaeri_minami8',
};

function toggleTable(key) {
  const el = document.getElementById('table-' + key);
  const btn = el.previousElementSibling.querySelector('button');
  if (el.classList.contains('open')) {
    el.classList.remove('open'); btn.textContent = '時刻表全表示 ▼';
  } else {
    renderFullTable('table-' + key, keyMap[key]);
    el.classList.add('open'); btn.textContent = '時刻表を閉じる ▲';
  }
}

function updateClock() {
  const now = new Date();
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('date-str').textContent = `${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;
  document.getElementById('day-type-label').textContent = dayLabels[currentDayType] + ' ▶';
}

function update() {
  updateClock();
  // 開いているテーブルを再描画
  document.querySelectorAll('.full-timetable.open').forEach(el => {
    const key = el.id.replace('table-', '');
    renderFullTable(el.id, keyMap[key]);
  });
  Object.keys(keyMap).forEach(k => renderNextBuses('next-' + k, keyMap[k]));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

update();
setInterval(update, 60000);
</script>
</body>
</html>
